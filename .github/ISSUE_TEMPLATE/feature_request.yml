name: Feature request
description: Suggest an improvement to this GetSimple CMS fork
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest improvements for johnstray/GetSimpleCMS here.
        Search existing issues before submitting. Do not include private site data or credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this solve, and who would benefit?
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Proposed improvement
      description: Describe the behaviour you would like and how it fits GetSimple CMS.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility
      description: Describe alternatives, including existing plugins or themes, and any installation, PHP compatibility, or upgrade implications.
  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Add relevant examples, links, or screenshots.
